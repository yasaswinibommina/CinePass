server.port=8081

spring.application.name=USER-SERVICE

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/userdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT
app.jwt.secret=CinePass-Review1-Secret-Key-2026-For-JWT-Authentication
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=CinePass User Service
info.app.description=User registration and JWT authentication service
