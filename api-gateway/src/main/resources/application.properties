
spring.application.name=API-GATEWAY
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# Authentication routes
spring.cloud.gateway.server.webmvc.routes[0].id=user-auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

# User routes
spring.cloud.gateway.server.webmvc.routes[1].id=user-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users/**

# Movie routes
spring.cloud.gateway.server.webmvc.routes[2].id=movie-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://MOVIE-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/movies/**

# Show routes
spring.cloud.gateway.server.webmvc.routes[3].id=show-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://SHOW-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/shows/**

# Booking routes
spring.cloud.gateway.server.webmvc.routes[4].id=booking-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/bookings/**
