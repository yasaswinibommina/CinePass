server.port=8084

spring.application.name=BOOKING-SERVICE

spring.datasource.url=jdbc:h2:file:./data/bookingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

app.jwt.secret=CinePass-Review1-Secret-Key-2026-For-JWT-Authentication
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=CinePass Booking Service
info.app.description=Ticket booking and seat allocation service
