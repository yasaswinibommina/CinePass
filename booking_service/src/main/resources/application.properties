
spring.application.name=booking-service
server.port=8084

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/cinepass_bookings
spring.datasource.username=postgres
spring.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# JWT - must match the User Service
app.jwt.secret=Y2luZXBhc3Mtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnRwdXJwb3Nlcw==
app.jwt.expiration=86400000
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Application Information
info.app.name=Booking Service
info.app.description=CinePass Booking Microservice
info.app.version=1.0
